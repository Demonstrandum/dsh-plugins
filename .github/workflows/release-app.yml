# Build the bundled macOS app and publish it as a GitHub Release — the feed
# the installed app's updater polls (Updater.swift reads releases/latest).
#
# Triggers:
#   - manually (Actions ▸ Release app ▸ Run workflow), optional notes / draft;
#   - a push to main whose head commit subject starts with `release:` — the
#     rest of the subject becomes the release notes.
#
# What runs is exactly `pnpm release-app` (tools/bundle/release.mjs): build
# number YYYYMMDDnn from the existing canary-* tags, fetch Node, stage the
# harness + plugins as tarballs, build DSH.app, the DMG (Finder-laid-out
# window, embedded icon), sha256, `gh release create canary-<build>` marked
# latest. Ad-hoc signed: first launch is right-click → Open. Developer ID
# signing/notarization would slot in via `--sign` once a certificate exists.
#
# The harness is built from the submodule at the commit this repo pins
# (release.mjs refuses anything else). A clean harness tree needs the Typert
# artifacts emitted before `pnpm build` — see recipes/bundled-app-dmg.md.
name: Release app

on:
  workflow_dispatch:
    inputs:
      notes:
        description: Release notes (markdown); default = commit subjects since the previous release
        required: false
        type: string
      draft:
        description: Create as a draft (not marked latest, updater ignores it)
        required: false
        type: boolean
        default: false
  push:
    branches: [main]

concurrency:
  group: release-app
  cancel-in-progress: false

jobs:
  release:
    # On push: only when the head commit says so. Manual runs always proceed.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release:')
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: write   # gh release create
    env:
      GH_TOKEN: ${{ github.token }}
      npm_config_manage_package_manager_versions: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # release.mjs reads canary-* tags and commit subjects
      - name: Harness submodule (pinned commit, over HTTPS)
        # .gitmodules uses SSH URLs and `extras` is private: init only the
        # harness, rewriting its URL, rather than `submodules: true`.
        run: |
          git config submodule.deepseek-harness.url https://github.com/taliesinb/deepseek-harness.git
          git submodule update --init --depth 1 deepseek-harness
          git -C deepseek-harness rev-parse --short HEAD

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: deepseek-harness/pnpm-lock.yaml

      # KNOWN BLOCKER (2026-09-30): at the currently pinned harness commit,
      # `build:lib:host` fails from a CLEAN tree with 55 TS errors — the client
      # files of session-controller / workspace-files import the `/remote`
      # Typert artifacts that the same build emits later (a long-lived checkout
      # never sees this; its stale lib/ breaks the cycle). Nothing in this repo
      # can fix that; it is a harness build-graph defect. Until it is fixed
      # upstream this job fails here, and releases are cut locally with
      # `pnpm release-app` from a worktree at the pin (recipe). The job stays
      # so the pipeline is one green harness commit away from working.
      - name: Build the harness (pinned commit)
        working-directory: deepseek-harness
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Release notes
        id: notes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            printf '%s' "${{ inputs.notes }}" > /tmp/notes.md
          else
            # "release: <text>" → "<text>" (first line only; the body stays in git)
            git log -1 --format=%s | sed -E 's/^release:[[:space:]]*//' > /tmp/notes.md
          fi
          echo "has=$([ -s /tmp/notes.md ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"

      - name: Build and publish
        shell: bash
        run: |
          args=(--repo "$GITHUB_REPOSITORY")
          [ "${{ steps.notes.outputs.has }}" = "1" ] && args+=(--notes "$(cat /tmp/notes.md)")
          [ "${{ inputs.draft }}" = "true" ] && args+=(--draft)
          node tools/bundle/release.mjs "${args[@]}"

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Release app"
            ls dist/bundle/*.dmg 2>/dev/null | sed 's|^|- |' || echo "- no DMG produced"
            echo
            echo "Latest: https://github.com/$GITHUB_REPOSITORY/releases/latest"
          } >> "$GITHUB_STEP_SUMMARY"
